[project]
name = "store-assistant"
version = "0.1.0"
description = "Store associate product knowledge assistant (LangGraph + Ollama RAG)"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
ui = ["streamlit>=1.35"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/store_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
